<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty - Universal Prompt Optimizer</title>
    <style>
        :root { --bg: #1e1e2e; --surface: #2b2b3d; --text: #cdd6f4; --primary: #89b4fa; --border: #45475a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); }
        .workspace { display: flex; gap: 20px; margin-top: 20px; }
        .panel { flex: 1; background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        textarea { width: 100%; height: 300px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 10px; resize: vertical; font-family: monospace; box-sizing: border-box; }
        select { width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; margin-top: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: var(--bg); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        label { font-weight: bold; margin-bottom: 5px; display: block; margin-top: 10px; }
        .output-box { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Chatty - Universal Prompt Optimizer</h1>
        <div class="workspace">
            <!-- Input Panel -->
            <div class="panel">
                <h3>Raw Input</h3>
                <label for="raw_input">What do you want the AI to do?</label>
                <textarea id="raw_input" placeholder="e.g. I need a blog post about python dicts, make it sound like a pirate, dont use complex words..."></textarea>
                
                <label for="target_model">Target AI Model</label>
                <select id="target_model">
                    <option value="openai">OpenAI (GPT-3.5/4)</option>
                    <option value="anthropic">Anthropic (Claude)</option>
                </select>
                
                <button id="submitBtn" onclick="optimizePrompt()">⚡ Generate Perfect Prompt</button>
            </div>

            <!-- Output Panel -->
            <div class="panel">
                <h3>Optimized Prompt</h3>
                <textarea id="output" readonly class="output-box" placeholder="Your optimized prompt will appear here..."></textarea>
                <button onclick="copyToClipboard()" style="background: var(--surface); color: var(--primary); border: 1px solid var(--border);">📋 Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        async function optimizePrompt() {
            const rawInput = document.getElementById('raw_input').value;
            const targetModel = document.getElementById('target_model').value;
            const outputArea = document.getElementById('output');
            const btn = document.getElementById('submitBtn');

            if (!rawInput.trim()) return alert("Please enter some text.");

            btn.disabled = true;
            btn.innerText = "Optimizing...";
            outputArea.value = "";

            try {
                const response = await fetch('/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ raw_input: rawInput, target_model: targetModel })
                });

                const data = await response.json();
                
                if (response.ok) {
                    outputArea.value = data.optimized_prompt;
                } else {
                    outputArea.value = `Error: ${data.detail || JSON.stringify(data)}`;
                }
            } catch (error) {
                outputArea.value = `Network Error: Is the server running?`;
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ Generate Perfect Prompt";
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('output');
            navigator.clipboard.writeText(output.value).then(() => {
                const btn = event.target;
                btn.innerText = "✅ Copied!";
                setTimeout(() => btn.innerText = "📋 Copy to Clipboard", 2000);
            });
        }
    </script>
</body>
</html>
